name: Deploy to Server

on:
  workflow_dispatch:  # Ручной запуск
  push:
    branches: [main]
    paths:
      - 'consumer/**'
      - 'Dockerfile'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mikhailrakov/mtz_msq/mtz-consumer

jobs:
  # 1. Сборка образа
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Деплой на сервер
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            
            echo "🔐 Создание .env файла..."
            cat > /opt/mtz/.env <<EOF
            AWS_S3_ENDPOINT=${{ secrets.AWS_S3_ENDPOINT }}
            AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
            AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            EOF
            chmod 600 /opt/mtz/.env
            
            echo "🔑 Логин в GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📥 Загрузка образа..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            echo "🧹 Остановка старого контейнера..."
            docker rm -f mtz-consumer 2>/dev/null || true
            
            echo "🚀 Запуск нового контейнера..."
            docker run -d --name mtz-consumer \
              --env-file /opt/mtz/.env \
              -e MCR_PATH=/opt/matlab \
              -e APP_DIR=/app/AP3DMT_app/application \
              -v /opt/matlab:/opt/matlab:ro \
              -v /opt/mtz/application:/app/AP3DMT_app/application \
              -v /opt/mtz/logs:/app/logs \
              --network host \
              --restart unless-stopped \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            echo "✅ Деплой завершён!"
            docker ps | grep mtz-consumer
